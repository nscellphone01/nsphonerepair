<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NS Cellphone Store</title>
<style>
:root{--bg:#0b1730;--panel:#11234a;--card:#17305f;--card2:#1d3a72;--line:#2a4686;--ink:#eef3ff;--mut:#9fb0d6;--green:#16a34a;--green2:#128a3e;--mango:#ffb703;--bad:#ef4444;--warn:#f59e0b;--blue:#3b82f6;
--phone:#3b82f6;--accessory:#14b8a6;--part:#94a3b8;--service:#f97316}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font:16px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
header{background:#071126;display:flex;align-items:center;gap:8px;padding:10px 14px;position:sticky;top:0;z-index:20;border-bottom:1px solid var(--line)}
.brand{font-weight:800;font-size:19px;margin-right:auto;white-space:nowrap}.brand b{color:var(--mango)}
.tab{background:transparent;border:0;color:var(--mut);padding:10px 16px;border-radius:12px;font-weight:700;cursor:pointer;font-size:16px}
.tab.on{background:var(--card2);color:#fff}
.lang{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer;font-weight:700}
main{padding:14px;max-width:1400px;margin:0 auto}
input,select,textarea{background:#0d1d3d;border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--blue)}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
.btn{background:var(--green);border:0;color:#fff;padding:12px 16px;border-radius:12px;font-weight:700;cursor:pointer;min-height:46px}
.btn:hover{background:var(--green2)}.btn.ghost{background:var(--card2);border:1px solid var(--line)}.btn.bad{background:var(--bad)}.btn.warn{background:var(--warn);color:#111}.btn.blue{background:var(--blue)}
.btn.sm{padding:7px 11px;min-height:34px;font-size:14px;border-radius:10px}.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>.grow{flex:1}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 12px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:14px}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.muted{color:var(--mut)}.small{font-size:13px}.r{text-align:right}.b{font-weight:800}.ok{color:#4ade80}.badc{color:#f87171}.warnc{color:var(--warn)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px}
h2{margin:0 0 8px;font-size:21px}h3{margin:14px 0 8px;font-size:17px}
/* sell */
.sell{display:grid;grid-template-columns:1fr 400px;gap:14px;align-items:start}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--part);border-radius:14px;padding:12px;cursor:pointer;min-height:96px;display:flex;flex-direction:column;justify-content:space-between;text-align:left}
.tile:hover{background:var(--card2)}.tile .n{font-weight:700;font-size:15px}.tile .p{font-weight:800;font-size:17px;color:var(--mango)}
.tile.phone{border-left-color:var(--phone)}.tile.accessory{border-left-color:var(--accessory)}.tile.service{border-left-color:var(--service)}.tile.out{opacity:.45}
.cart{position:sticky;top:76px}
.line{display:flex;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.line .nm{flex:1;min-width:0}.line .nm div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qb{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:800}
.tot{font-size:30px;font-weight:900;text-align:right}
.pay{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}.pay .btn{min-height:58px;font-size:17px}
.banner{background:var(--warn);color:#111;border-radius:12px;padding:10px 14px;margin-bottom:12px;font-weight:700;cursor:pointer}
/* lists */
.list{display:grid;gap:10px}
.tcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.tcard.overdue{border-color:var(--bad)}
.badge{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:800;background:var(--card2)}
.badge.received{background:#64748b}.badge.repairing{background:var(--blue)}.badge.ready{background:var(--green)}.badge.picked{background:#334155;color:#cbd5e1}
.badge.in{background:var(--green)}.badge.sold{background:#334155}.badge.returned{background:var(--warn);color:#111}
table.t{width:100%;border-collapse:collapse;font-size:14px}table.t th{text-align:left;color:var(--mut);font-weight:600;padding:8px 6px;border-bottom:1px solid var(--line)}
table.t td{padding:9px 6px;border-bottom:1px solid var(--line)}table.t tr.click{cursor:pointer}table.t tr.click:hover td{background:var(--card)}
.menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.mi{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;cursor:pointer;text-align:left}
.mi:hover{background:var(--card)}.mi .ic{font-size:28px}.mi .tt{font-weight:800;font-size:17px;margin-top:6px}.mi .ds{color:var(--mut);font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}.kpi .v{font-size:24px;font-weight:900}.kpi .l{color:var(--mut);font-size:13px}
/* modal */
#ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-start;justify-content:center;z-index:50;overflow:auto;padding:30px 12px}
#ov.on{display:flex}.modal{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;width:100%;max-width:640px;position:relative}
.x{position:absolute;right:12px;top:10px;background:none;border:0;font-size:26px;color:var(--mut);cursor:pointer}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#fff;color:#111;padding:12px 18px;border-radius:12px;font-weight:700;display:none;z-index:99;box-shadow:0 8px 30px rgba(0,0,0,.4)}
.check{display:flex;gap:10px;align-items:center;padding:8px 0}.check input{width:22px;height:22px}
video{width:100%;border-radius:12px;background:#000}
#dlg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:90;padding:16px}#dlg.on{display:flex}#dlg .modal{max-width:420px}
.pin{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}.pin button{min-height:58px;font-size:24px;font-weight:800;border-radius:14px;background:var(--card2);border:1px solid var(--line);cursor:pointer}.pin button:active{background:var(--blue)}
.dots{display:flex;gap:14px;justify-content:center;margin:14px 0 4px}.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--mut)}.dots i.on{background:var(--mango);border-color:var(--mango)}
#lock{position:fixed;inset:0;background:var(--bg);z-index:85;display:none;align-items:flex-start;justify-content:center;padding:28px 16px}#lock.on{display:flex}
.who{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer;font-weight:700;white-space:nowrap;max-width:140px;overflow:hidden;text-overflow:ellipsis}
.brand img{height:30px;vertical-align:middle;margin-right:8px;border-radius:6px;background:#fff;padding:2px}
.dash{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-bottom:14px}.dash .kpi{cursor:pointer}.dash .kpi:hover{background:var(--card)}
#camov{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:flex-start;justify-content:center;z-index:70;padding:30px 12px;overflow:auto}#camov.on{display:flex}
.scanbox{display:flex;gap:8px;align-items:center;background:var(--card);border:2px dashed var(--blue);border-radius:14px;padding:8px 10px;margin-top:10px}.scanbox input{border:0;background:transparent;font-size:17px}
@media(max-width:900px){.sell{grid-template-columns:1fr}.cart{position:static}.g3{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.g2,.g3{grid-template-columns:1fr}.brand{font-size:15px;min-width:0;overflow:hidden;text-overflow:ellipsis}header{gap:4px;padding:8px 10px}.tab{padding:9px 8px;font-size:15px}.lang{padding:7px 8px}main{padding:10px}}
</style>
</head>
<body>
<header>
 <div class="brand" id="brand">NS <b>Cellphone</b> Store</div>
 <button class="tab" data-v="sell" onclick="go('sell')" id="t-sell"></button>
 <button class="tab" data-v="repairs" onclick="go('repairs')" id="t-repairs"></button>
 <button class="tab" data-v="menu" onclick="go('menu')" id="t-menu"></button>
 <span id="cloudSt" style="display:none;font-weight:800;cursor:pointer;padding:0 6px" onclick="go('menu','cloud')"></span>
 <button class="who" id="whoBtn" style="display:none" onclick="lockNow()"></button>
 <button class="lang" onclick="toggleLang()" id="langBtn">SO</button>
</header>
<main id="app"></main>
<div id="ov" onclick="if(event.target.id==='ov')closeM()"><div class="modal" id="mod"></div></div>
<div id="camov"></div>
<div id="dlg"></div><div id="lock"></div>
<div id="toast"></div>

function toggleLang(){D.settings.lang=D.settings.lang==='en'?'so':'en';save();render()}

/* ================= HELPERS ================= */
const $=id=>document.getElementById(id);
const money=n=>(n<0?'-$':'$')+Math.abs(+n||0).toFixed(2);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=parseFloat(String(v).replace(/[^0-9.\-]/g,''));return isNaN(n)?0:n};
const r2=n=>Math.round(n*100)/100;
const gstOf=tot=>r2(tot*D.settings.gst/(100+D.settings.gst));
const ADD=()=>D.settings.taxMode!=='included';
const gstTag=()=>ADD()?'+ GST':'GST incl.';
const P=id=>D.products.find(p=>p.id===id);
const C=id=>D.customers.find(c=>c.id===id);
const fmtD=ts=>new Date(ts).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});
const fmtDT=ts=>new Date(ts).toLocaleString(undefined,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
const dayStart=(d=new Date())=>{const x=new Date(d);x.setHours(0,0,0,0);return x.getTime()};
function toast(m){const e=$('toast');e.textContent=m;e.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>e.style.display='none',2600)}
function openM(h){$('mod').innerHTML='<button class="x" onclick="closeM()">×</button>'+h;$('ov').classList.add('on');setTimeout(()=>{const a=document.activeElement;if(a&&$('mod').contains(a)&&a.matches('input,textarea,select'))return;const f=$('mod').querySelector('[autofocus]');f&&f.focus()},50)}

const C128='212222 222122 222221 121223 121322 131222 122213 122312 132212 221213 221312 231212 112232 122132 122231 113222 123122 123221 223211 221132 221231 213212 223112 312131 311222 321122 321221 312212 322112 322211 212123 212321 232121 111323 131123 131321 112313 132113 132311 211313 231113 231311 112133 112331 132131 113123 113321 133121 313121 211331 231131 213113 213311 213131 311123 311321 331121 312113 312311 332111 314111 221411 431111 111224 111422 121124 121421 141122 141221 112214 112412 122114 122411 142112 142211 241211 221114 413111 241112 134111 111242 121142 121241 114212 124112 124211 411212 421112 421211 212141 214121 412121 111143 111341 131141 114113 114311 411113 411311 113141 114131 311141 411131 211412 211214 211232 2331112'.split(' ');
function barcodeSVG(text,h=40){text=String(text).replace(/[^\x20-\x7e]/g,'');const codes=[104];for(const ch of text)codes.push(ch.charCodeAt(0)-32);
 let ck=104;codes.slice(1).forEach((c,i)=>ck+=c*(i+1));codes.push(ck%103,106);
 let x=10,bars='';for(const c of codes){const w=C128[c];for(let i=0;i<w.length;i++){const n=+w[i];if(i%2===0)bars+=`<rect x="${x}" y="0" width="${n}" height="${h}"/>`;x+=n}}
 return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${x+10} ${h}" preserveAspectRatio="none" style="width:100%;height:${h}px">${bars}</svg>`}

function rndHex(n){const a=new Uint8Array(n);crypto.getRandomValues(a);return [...a].map(v=>v.toString(16).padStart(2,'0')).join('')}
function newCode(){const A='ABCDEFGHJKMNPQRSTUVWXYZ23456789';const a=new Uint8Array(12);crypto.getRandomValues(a);const c=[...a].map(v=>A[v%A.length]).join('');return c.slice(0,4)+'-'+c.slice(4,8)+'-'+c.slice(8)}
const normCode=c=>String(c||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
async function sha(x){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(x));return [...new Uint8Array(b)].map(v=>v.toString(16).padStart(2,'0')).join('')}
async function pwHash(pw,salt){let h=salt+':'+pw;for(let i=0;i<3000;i++)h=await sha(salt+h);return h}

function brandHTML(){const S=D.settings;return (S.logo?`<img src="${S.logo}" alt="">`:'')+esc(S.name)}
function setLogo(file){if(!file)return;const rd=new FileReader();rd.onload=()=>{const im=new Image();im.onload=()=>{const sc=Math.min(1,400/im.width,160/im.height);const c=document.createElement('canvas');c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);
 const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(im,0,0,c.width,c.height);let u=c.toDataURL('image/png');if(u.length>90000)u=c.toDataURL('image/jpeg',.85);
 D.settings.logo=u;save();render();toast('Logo saved ✓')};im.onerror=()=>toast('Could not read that image');im.src=rd.result};rd.readAsDataURL(file)}
function receiptText(s){const S=D.settings;let x=`${S.name}\n${S.addr}${S.phone?' · '+S.phone:''}\n\n${{refund:'Refund',repair:'Repair payment',deposit:'Repair deposit'}[s.kind]||'Receipt'} #${s.no} — ${new Date(s.ts).toLocaleString()}\n\n`;
 s.lines.forEach(l=>x+=`${l.name}${l.qty>1?' x'+l.qty:''}${l.imei?' (IMEI '+l.imei+')':''}: ${money(l.price*l.qty)}\n`);if(s.disc)x+=`Discount: -${money(s.disc)}\n`;if(s.trade)x+=`Trade-in: -${money(s.trade.price)}\n`;
 if(s.taxMode==='added')x+=`\nSubtotal: ${money(s.net)}\nGST ${S.gst}%: ${money(s.gstFull??s.gst)}\n`;if(s.deposit)x+=`Deposit paid: -${money(s.deposit)}\n`;
 x+=`TOTAL: ${money(s.total)}${s.taxMode==='added'?'':' (GST '+money(s.gst)+' incl.)'}\nPaid by: ${s.method==='etransfer'?'e-Transfer':String(s.method).toUpperCase()}\n${S.gstNo?'GST# '+S.gstNo+'\n':''}${S.footer?'\n'+S.footer+'\n':''}\nThank you! / Mahadsanid!`;return x}
const mailLink=s=>{const c=C(s.cust)||{};return 'mailto:'+encodeURIComponent(c.email||'')+'?subject='+encodeURIComponent('Receipt #'+s.no+' — '+D.settings.name)+'&body='+encodeURIComponent(receiptText(s))};
const smsReceipt=s=>{const c=C(s.cust)||{};return 'sms:'+(c.phone||'').replace(/[^\d+]/g,'')+'?&body='+encodeURIComponent(receiptText(s))};

 return `<div class="top"><div>${S.logo?`<img src="${S.logo}">`:''}<h1>${esc(S.name)}</h1><div class="muted">${esc(S.addr)}${S.phone?'<br>'+esc(S.phone):''}${S.web?'<br>'+esc(S.web):''}${S.gstNo?'<br>GST # '+esc(S.gstNo):''}</div></div>
 <div class="doc"><h2>${title}</h2><div><b># ${esc(o.no||s.no)}</b><br>${fmtD(s.ts)}${s.by?'<br>Served by '+esc(s.by):''}</div></div></div>
 <div class="cols"><div><b>Bill to</b><br>${c.name?esc(c.name):'Walk-in customer'}${c.phone?'<br>'+esc(c.phone):''}${c.email?'<br>'+esc(c.email):''}</div>${o.extra||''}</div>
 <table><tr><th>Description</th><th class="r">Qty</th><th class="r">Price</th><th class="r">Amount</th></tr>
 ${s.lines.map(l=>`<tr><td>${esc(l.name)}${l.imei?'<br><span class="muted">IMEI '+esc(l.imei)+'</span>':''}</td><td class="r">${l.qty}</td><td class="r">${money(l.price)}</td><td class="r">${money(l.price*l.qty)}</td></tr>`).join('')}

 <table class="tot">${added?`<tr><td>Subtotal</td><td class="r">${money(s.net)}</td></tr><tr><td>GST ${S.gst}%</td><td class="r">${money(s.gstFull??s.gst)}</td></tr><tr class="g"><td>Total</td><td class="r">${money(grand)}</td></tr>`
 :`<tr class="g"><td>Total</td><td class="r">${money(grand)}</td></tr><tr><td>GST ${S.gst}% included</td><td class="r">${money(gstOf(grand))}</td></tr>`}

 ${o.unpaid?'':`<tr><td>Paid by</td><td class="r">${s.method==='etransfer'?'e-Transfer':String(s.method||'').toUpperCase()}</td></tr>`}</table>
 ${o.sign?'<div class="sig">Customer signature</div>':''}
 <div class="foot">${o.note?esc(o.note)+'<br>':''}${s.kind==='sale'&&s.lines.some(l=>l.imei)?esc(S.warranty)+'-day warranty on devices. ':''}${s.kind==='repair'?esc(S.repairWarranty)+'-day warranty on repair parts &amp; labour. ':''}${esc(S.footer||'')}<br>Thank you for your business! / Mahadsanid!</div>`}
function estimateHTML(r){const tot=repTotal(r);const s={no:'R'+r.no,ts:r.ts,cust:r.cust,by:r.by,kind:'estimate',lines:[{name:'Repair: '+r.device+' – '+r.issue,price:r.quote,qty:1}],taxMode:ADD()?'added':'included',net:r.quote,gstFull:r2(tot-r.quote),grand:tot,deposit:r.deposit||0,total:repBal(r),gst:gstOf(tot)};
 return invoiceHTML(s,{title:'REPAIR ESTIMATE',no:'R'+r.no,unpaid:true,sign:true,extra:`<div><b>Device</b><br>${esc(r.device)}${r.imei?'<br>IMEI '+esc(r.imei):''}<br>Ready by: ${esc(r.due||'—')}</div>`,note:D.settings.terms})}

function printHTML(body,kind='receipt'){
 const css=kind==='a4'?A4CSS:kind==='label'?`@page{size:57mm 32mm;margin:0}body{margin:0;font:11px Arial}.lb{width:57mm;height:32mm;padding:2mm 3mm;box-sizing:border-box;page-break-after:always;overflow:hidden}.lb .n{font-weight:700;font-size:11px;white-space:nowrap;overflow:hidden}.lb .p{font-size:15px;font-weight:900}.lb .c{font-size:9px;text-align:center;letter-spacing:1px}`
 :`@page{size:72mm auto;margin:3mm}body{margin:0;font:12px/1.35 Arial;width:68mm;color:#000}.c{text-align:center}.r{text-align:right}.b{font-weight:700}table{width:100%;border-collapse:collapse}td{vertical-align:top;padding:1px 0}hr{border:0;border-top:1px dashed #000;margin:6px 0}h1{font-size:16px;margin:0}.sig{border-bottom:1px solid #000;height:28px;margin-top:10px}`;
 const f=document.createElement('iframe');f.style.cssText='position:fixed;right:0;bottom:0;width:0;height:0;border:0';document.body.appendChild(f);
 const d=f.contentWindow.document;d.open();d.write(`<!doctype html><html><head><meta charset="utf-8"><style>${css}</style></head><body>${body}</body></html>`);d.close();
 setTimeout(()=>{try{f.contentWindow.focus();f.contentWindow.print()}catch(e){}setTimeout(()=>f.remove(),1500)},250)}

let SQ='',SC='all',cart=[],cartCust=null,cartDisc=0,cartTrade=null;
function needBackup(){return(D.sales.length||D.repairs.length)&&Date.now()-(D.lastBackup||0)>7*864e5}
function vSell(){
 return `${needBackup()?`<div class="banner" onclick="go('menu','backup')">${t('backupNow')}</div>`:''}
 <div class="sell"><section>
  <div class="row"><input class="grow" id="sq" placeholder="${t('search')}" value="${esc(SQ)}" oninput="SQ=this.value;drawGrid()" onkeydown="if(event.key==='Enter'){scanCode(this.value);}" autocomplete="off" style="flex:1;font-size:17px">
  <button class="btn ghost" onclick="camScan(scanCode)">${t('scan')}</button></div>
  <div class="chips">${['all','phone','accessory','part','service'].map(c=>`<button class="chip ${SC===c?'on':''}" onclick="SC='${c}';render()">${t(c)}</button>`).join('')}</div>
  <div class="grid" id="grid"></div>
 </section><aside class="card cart" id="cart"></aside></div>`}
function drawGrid(){const q=SQ.trim().toLowerCase();
 let ps=D.products.filter(p=>(SC==='all'?p.cat!=='part':p.cat===SC));
 if(q){const um=D.units.filter(u=>u.status==='in'&&u.imei.includes(q)).map(u=>u.pid);ps=D.products.filter(p=>(p.name+' '+p.sku+' '+p.barcode).toLowerCase().includes(q)||um.includes(p.id))}
 $('grid').innerHTML=ps.length?ps.map(p=>{const s=stockOf(p);return `<button class="tile ${p.cat} ${s<=0?'out':''}" onclick="addP('${p.id}')"><div class="n">${esc(p.name)}</div>
  <div class="row" style="justify-content:space-between"><span class="p">${money(p.price)}</span><span class="small ${s<=p.min&&s!==Infinity?'warnc':'muted'}">${s===Infinity?'':s<=0?t('out'):s+' '+t('inStock')}</span></div></button>`}).join(''):`<p class="muted">${t('noItems')}</p>`}
function scanCode(v){v=String(v||'').trim();if(!v)return;
 const sm=v.match(/^S(\d+)$/i);if(sm){const s=D.sales.find(x=>x.no==+sm[1]);if(s){clearSearch();beep();return showReceipt(s.id)}}
 const rm=v.match(/^R(\d+)$/i);if(rm){const r=D.repairs.find(x=>x.no==+rm[1]);if(r){clearSearch();beep();return ticketForm(r.id)}}
 const u=D.units.find(u=>u.imei===v&&u.status==='in');if(u){addUnit(u.id);clearSearch();return}
 const p=D.products.find(p=>p.barcode===v||(p.sku&&p.sku.toLowerCase()===v.toLowerCase()));if(p){addP(p.id);clearSearch();return}
 const sold=D.units.find(u=>u.imei===v);if(sold){toast('IMEI '+v+' — '+sold.status);return}
 const ps=D.products.filter(p=>p.name.toLowerCase().includes(v.toLowerCase())&&p.cat!=='part');if(ps.length===1){addP(ps[0].id);clearSearch();return}
 if(!ps.length){beep(true);toast(t('unknown')+': '+v);productForm(null,v)}}
function clearSearch(){SQ='';const e=$('sq');if(e){e.value='';e.focus()}drawGrid()}
function inCart(pid){return cart.filter(l=>l.pid===pid).reduce((a,l)=>a+l.qty,0)}
function addP(id){const p=P(id);if(!p)return;
 if(p.serial){const us=D.units.filter(u=>u.pid===id&&u.status==='in'&&!cart.some(l=>l.uid===u.id));
  if(!us.length)return toast(t('out'));if(us.length===1)return addUnit(us[0].id);
  return openM(`<h2>${esc(p.name)}</h2><p class="muted">${t('chooseImei')}</p><div class="list">${us.map(u=>`<button class="tcard" style="text-align:left;cursor:pointer" onclick="addUnit('${u.id}');closeM()"><b>${esc(u.imei)}</b> <span class="badge">${esc(u.cond||'')}</span>${u.price?` <b style="color:var(--mango)">${money(u.price)}</b>`:''}<div class="muted small">${t('cost')} ${money(u.cost)} · ${fmtD(u.added)}</div></button>`).join('')}</div>`)}
 const s=stockOf(p);if(s!==Infinity&&inCart(id)>=s)return toast(t('out'));
 const l=cart.find(l=>l.pid===id&&!l.uid);if(l)l.qty++;else cart.push({pid:id,name:p.name,price:p.price,cost:p.cost,qty:1});drawCart();drawGrid()}
function addUnit(uidv){const u=D.units.find(x=>x.id===uidv);if(!u||cart.some(l=>l.uid===uidv))return;const p=P(u.pid);
 cart.push({pid:u.pid,uid:u.id,imei:u.imei,name:p.name+(u.cond&&u.cond!=='New'?' ('+u.cond.split(' ')[0]+')':''),price:u.price||p.price,cost:u.cost,qty:1});drawCart();drawGrid()}
function cartSub(){return r2(cart.reduce((a,l)=>a+l.price*l.qty,0))}
function cartNet(){return r2(cartSub()-cartDisc-(cartTrade?cartTrade.price:0))}
function cartTax(){const n=cartNet();if(n<=0)return 0;return ADD()?r2(n*D.settings.gst/100):gstOf(n)}
function cartTotal(){const n=cartNet();return ADD()&&n>0?r2(n+cartTax()):n}
function drawCart(){const tot=cartTotal();
 $('cart').innerHTML=`<div class="row" style="justify-content:space-between"><h2>${t('cart')}</h2>${cart.length||cartTrade?`<button class="btn ghost sm" onclick="clearCart()">${t('clear')}</button>`:''}</div>
 <button class="btn ghost sm" style="width:100%;text-align:left" onclick="pickCustomer()">👤 ${cartCust?esc(custName(cartCust)):t('walkin')}</button>
 <div>${cart.length?cart.map((l,i)=>`<div class="line"><div class="nm"><div class="b">${esc(l.name)}</div><div class="small muted">${l.imei?'IMEI '+esc(l.imei)+' · ':''}<a style="color:var(--mango);cursor:pointer" onclick="editPrice(${i})">${money(l.price)}</a></div></div>
  ${l.uid?'':`<button class="qb" onclick="qty(${i},-1)">−</button><b style="min-width:20px;text-align:center">${l.qty}</b><button class="qb" onclick="qty(${i},1)">+</button>`}
  <b style="min-width:72px" class="r">${money(l.price*l.qty)}</b><button class="qb" onclick="cart.splice(${i},1);drawCart();drawGrid()">×</button></div>`).join(''):`<p class="muted" style="padding:18px 0;text-align:center">${t('empty')}</p>`}</div>
 <div class="row" style="margin-top:10px"><button class="btn ghost sm" onclick="setDisc()">🏷 ${t('discount')}</button><button class="btn ghost sm" onclick="buyForm(true)">🔁 ${t('trade')}</button></div>
 <table class="t" style="margin-top:8px">${cartDisc||cartTrade?`<tr><td>${t('subtotal')}</td><td class="r">${money(cartSub())}</td></tr>`:''}
 ${cartDisc?`<tr><td>${t('discount')} <a style="cursor:pointer" onclick="cartDisc=0;drawCart()">×</a></td><td class="r">-${money(cartDisc)}</td></tr>`:''}
 ${cartTrade?`<tr><td>${t('trade')}: ${esc(cartTrade.device)} <a style="cursor:pointer" onclick="cartTrade=null;drawCart()">×</a></td><td class="r">-${money(cartTrade.price)}</td></tr>`:''}</table>
 ${ADD()?`<table class="t"><tr><td>${t('beforeGst')}</td><td class="r">${money(cartNet())}</td></tr><tr><td>GST ${D.settings.gst}%</td><td class="r">+${money(cartTax())}</td></tr></table>`:''}
 <div class="tot">${money(tot)}</div>${ADD()?`<div class="r muted small">${t('total')} incl. GST</div>`:`<div class="r muted small">${t('gstIncl')} ${money(cartTax())}</div>`}
 <div class="pay"><button class="btn" onclick="pay('cash')" ${cart.length?'':'disabled'}>💵 ${t('cash')}</button><button class="btn" onclick="pay('card')" ${cart.length?'':'disabled'}>💳 ${t('card')}</button><button class="btn" onclick="pay('etransfer')" ${cart.length?'':'disabled'}>📲 ${t('etransfer')}</button></div>`}
function qty(i,d){const l=cart[i];const p=P(l.pid);const s=stockOf(p);if(d>0&&s!==Infinity&&inCart(l.pid)>=s)return toast(t('out'));l.qty+=d;if(l.qty<=0)cart.splice(i,1);drawCart();drawGrid()}
async function editPrice(i){const l=cart[i];const a=await ask({title:t('price')+' — '+l.name,input:String(l.price),numeric:true,ok:t('save')});if(!a)return;const v=r2(num(a.value));
 if(v<l.cost){if(!(await needOwner('Price below cost ('+money(l.cost)+')')))return;logEv('money','Price below cost: '+l.name+' '+money(v)+' (cost '+money(l.cost)+')')}l.price=v;drawCart()}
async function setDisc(){const a=await ask({title:t('discount'),input:cartDisc?String(cartDisc):'',numeric:true,ph:'10',choices:[{v:'$',l:'$ amount'},{v:'%',l:'% percent'}],pick:'$',ok:t('save')});if(!a)return;
 const pct=a.pick==='%'||String(a.value).includes('%');const d=Math.min(pct?r2(cartSub()*num(a.value)/100):r2(num(a.value)),cartSub());const max=D.settings.maxDisc??15;
 if(d>0&&cartSub()>0&&d/cartSub()*100>max+1e-9){if(!(await needOwner(t('discount')+' over '+max+'%')))return;logEv('money','Discount '+money(d)+' approved (over '+max+'%)')}cartDisc=d;drawCart()}
function clearCart(){cart=[];cartCust=null;cartDisc=0;cartTrade=null;drawCart();drawGrid()}

 openM(`<h2>${t('cust')}</h2><input id="pcq" placeholder="Name, phone (any part), email, IMEI or receipt #" oninput="pcList()" autofocus autocomplete="off"><div id="pcl" class="list" style="margin:10px 0;max-height:40vh;overflow:auto"></div>

function pay(method){const tot=cartTotal();if(!cart.length)return;if(tot<0)return toast(t('tradeTooBig'));
 if(method==='cash'){const quick=[...new Set([Math.ceil(tot/5)*5,Math.ceil(tot/10)*10,Math.ceil(tot/20)*20,Math.ceil(tot/50)*50,100].filter(v=>v>tot))].sort((a,b)=>a-b).slice(0,4);
  openM(`<h2>💵 ${t('cash')} — ${money(tot)}</h2><label>${t('tendered')}</label><input id="tend" inputmode="decimal" autofocus oninput="chg(${tot})" onkeydown="if(event.key==='Enter')finishSale('cash')" style="font-size:24px">
  <div class="chips"><button class="chip" onclick="$('tend').value='${tot}';chg(${tot})">${t('exact')}</button>${quick.map(q=>`<button class="chip" onclick="$('tend').value='${q}';chg(${tot})">$${q}</button>`).join('')}</div>
  <div class="tot" id="chgv" style="color:#4ade80"></div><button class="btn" style="width:100%;min-height:60px;font-size:19px;margin-top:10px" onclick="finishSale('cash')">${t('complete')}</button>`)}
 else openM(`<h2>${method==='card'?'💳 '+t('card'):'📲 '+t('etransfer')} — ${money(tot)}</h2><p class="muted">${method==='card'?'Run the card on the terminal first, then complete.':'Confirm the e-Transfer arrived, then complete.'}</p>
  <button class="btn" style="width:100%;min-height:60px;font-size:19px" onclick="finishSale('${method}')">${t('complete')}</button>`)}
function chg(tot){const v=num($('tend').value);$('chgv').textContent=v>=tot?t('change')+': '+money(v-tot):''}
function finishSale(method){const tot=cartTotal();let tend=0;if(method==='cash'){tend=num($('tend').value)||tot;if(tend<tot)return toast('Not enough cash')}
 const s={id:uid(),no:D.seq.sale++,ts:Date.now(),by:whoName(),kind:'sale',lines:cart.map(l=>({...l})),disc:cartDisc,total:tot,gst:cartTax(),net:cartNet(),taxMode:ADD()?'added':'included',method,tendered:tend,cust:cartCust,
  cost:r2(cart.reduce((a,l)=>a+l.cost*l.qty,0))};
 if(cartTrade){const b=commitBuy(cartTrade,'trade');b.saleId=s.id;s.trade={device:cartTrade.device,imei:cartTrade.imei,price:cartTrade.price}}
 for(const l of cart){const p=P(l.pid);if(l.uid){const u=D.units.find(x=>x.id===l.uid);u.status='sold';u.saleId=s.id;u.soldTs=s.ts;u.cust=cartCust}else if(p&&p.cat!=='service'&&!p.serial)p.qty-=l.qty}
 D.sales.push(s);save();clearCart();showReceipt(s.id,true)}
function receiptHTML(s){const c=C(s.cust);
 let h=storeHead()+`<div>${{refund:'REFUND',repair:'REPAIR PAYMENT',deposit:'REPAIR DEPOSIT'}[s.kind]||'RECEIPT'} #${s.no}<br>${new Date(s.ts).toLocaleString()}${c?'<br>Customer: '+esc(c.name):''}${s.by?'<br>Served by: '+esc(s.by):''}</div><hr><table>`;
 for(const l of s.lines)h+=`<tr><td>${esc(l.name)}${l.qty>1?' x'+l.qty:''}${l.imei?'<br>IMEI '+esc(l.imei):''}</td><td class="r">${money(l.price*l.qty)}</td></tr>`;
 if(s.disc)h+=`<tr><td>Discount</td><td class="r">-${money(s.disc)}</td></tr>`;
 if(s.trade)h+=`<tr><td>Trade-in: ${esc(s.trade.device)}${s.trade.imei?'<br>IMEI '+esc(s.trade.imei):''}</td><td class="r">-${money(s.trade.price)}</td></tr>`;
 if(s.deposit&&s.taxMode!=='added')h+=`<tr><td>Less deposit paid</td><td class="r">-${money(s.deposit)}</td></tr>`;
 h+=`</table><hr><table>`+(s.taxMode==='added'?`<tr><td>Subtotal (before GST)</td><td class="r">${money(s.net)}</td></tr><tr><td>GST ${D.settings.gst}%</td><td class="r">${money(s.gstFull??s.gst)}</td></tr>${s.deposit?`<tr><td>Total</td><td class="r">${money(s.grand)}</td></tr><tr><td>Less deposit paid</td><td class="r">-${money(s.deposit)}</td></tr>`:''}<tr><td class="b">${s.deposit?'BALANCE PAID':'TOTAL'}</td><td class="r b">${money(s.total)}</td></tr>`:`<tr><td class="b">TOTAL</td><td class="r b">${money(s.total)}</td></tr><tr><td>GST ${D.settings.gst}% included</td><td class="r">${money(s.gst)}</td></tr>`)+`
 <tr><td>Paid by</td><td class="r">${s.method==='etransfer'?'e-Transfer':String(s.method).toUpperCase()}</td></tr>${s.method==='cash'&&s.tendered>s.total?`<tr><td>Cash</td><td class="r">${money(s.tendered)}</td></tr><tr><td>Change</td><td class="r">${money(s.tendered-s.total)}</td></tr>`:''}</table><hr>`;
 if(s.kind==='sale'&&s.lines.some(l=>l.imei))h+=`<div>${D.settings.warranty}-day warranty on devices. Keep this receipt.</div>`;
 if(s.kind==='repair')h+=`<div>${D.settings.repairWarranty}-day warranty on repair parts &amp; labour. Water damage not covered.</div>`;
 return h+`${D.settings.footer?`<div class="c" style="margin-top:6px;font-size:11px;white-space:pre-line">${esc(D.settings.footer)}</div>`:''}<div class="c" style="margin-top:6px">Thank you! / Mahadsanid!</div><div class="c" style="margin-top:6px">${barcodeSVG('S'+s.no,30)}</div>`}
function showReceipt(id,fresh){const s=D.sales.find(x=>x.id===id);if(!s)return;
 openM(`<h2>${fresh?'✓ '+t('sold'):'#'+s.no}</h2>${fresh&&s.method==='cash'&&s.tendered>s.total?`<div class="tot" style="text-align:left;color:#4ade80">${t('change')}: ${money(s.tendered-s.total)}</div>`:''}
 <div style="background:#fff;color:#111;border-radius:12px;padding:12px;font:13px/1.4 ui-monospace,monospace;margin:10px 0;max-height:46vh;overflow:auto">${receiptHTML(s).replace(/<table>/g,'<table style="width:100%">').replace(/class="r/g,'style="text-align:right" class="r').replace(/class="c"/g,'style="text-align:center"').replace(/<hr>/g,'<hr style="border:0;border-top:1px dashed #999">')}</div>
 <div class="row"><button class="btn ghost" onclick="printHTML(receiptHTML(D.sales.find(x=>x.id==='${id}')))">${t('print')}</button><button class="btn ghost" onclick="printHTML(invoiceHTML(D.sales.find(x=>x.id==='${id}')),'a4')">📄 Invoice</button>
 ${(C(s.cust)||{}).email?`<a class="btn ghost" style="text-decoration:none;display:inline-flex;align-items:center" href="${mailLink(s)}">📧 Email</a>`:''}${(C(s.cust)||{}).phone?`<a class="btn ghost" style="text-decoration:none;display:inline-flex;align-items:center" href="${smsReceipt(s)}">💬 Text</a>`:''}
 ${!fresh&&s.kind==='sale'&&!s.refunded?`<button class="btn bad" onclick="refund('${id}')">${t('refund')}</button>`:''}
 ${fresh?`<button class="btn" onclick="closeM()">${t('newSale')}</button>`:''}</div>${s.refunded?`<p class="warnc">${t('refunded')}</p>`:''}`)}
async function refund(id){const s=D.sales.find(x=>x.id===id);if(!s||s.refunded)return;
 const ans=await ask({title:t('refund')+' #'+s.no+' — '+money(s.total),msg:s.lines.map(l=>l.name).join(', ').slice(0,140)+'\n\n'+t('methodQ'),choices:['cash','card','etransfer'].map(m=>({v:m,l:t(m)})),pick:s.method,ok:t('refund'),danger:true});if(!ans)return;
 if(!(await needOwner(t('refund'))))return;const method=ans.pick||s.method;
 for(const l of s.lines){const p=P(l.pid);if(l.uid){const u=D.units.find(x=>x.id===l.uid);if(u){u.status='in';delete u.saleId;delete u.soldTs;delete u.cust}}else if(p&&p.cat!=='service'&&!p.serial)p.qty+=l.qty}
 const r={id:uid(),no:D.seq.sale++,ts:Date.now(),by:whoName(),kind:'refund',refOf:s.id,lines:s.lines.map(l=>({...l,price:-l.price})),total:-s.total,gst:-s.gst,net:-(s.net||0),taxMode:s.taxMode,cost:-s.cost,method,cust:s.cust,tendered:0};
 s.refunded=r.id;D.sales.push(r);logEv('money','Refund #'+r.no+' of sale #'+s.no+' — '+money(-r.total)+' ('+method+')');save();closeM();toast(t('refunded'));showReceipt(r.id)}

/* ================= CAMERA SCAN ================= */
let camStream=null,camTimer=null,zx=null,camCb=null,camLast='',camLastT=0,camCont=false,AC=null;
function beep(bad){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=bad?220:1250;g.gain.value=.08;o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+(bad?.25:.08))}catch(e){}}
function loadZX(){return new Promise((res,rej)=>{if(window.ZXing)return res();const sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js';sc.onload=res;sc.onerror=()=>rej(new Error('load'));document.head.appendChild(sc)})}
function camHit(val){const n=Date.now();if(val===camLast&&n-camLastT<1500)return;camLast=val;camLastT=n;beep();if(camCont){const r=$('camres');if(r)r.textContent='✓ '+val;camCb(val)}else{stopCam();camCb(val)}}
async function camScan(cb,cont=false){camCb=cb;camCont=cont;camLast='';const o=$('camov');
 o.innerHTML=`<div class="modal" style="max-width:520px"><button class="x" onclick="stopCam()">×</button><h2>${t('scan')}</h2><video id="camv" playsinline muted></video><div id="camres" class="b ok" style="min-height:24px;margin-top:8px"></div><button class="btn ghost" style="width:100%;margin-top:8px" onclick="stopCam()">${cont?t('done'):t('cancel')}</button></div>`;o.classList.add('on');
 const v=$('camv');
 try{if('BarcodeDetector' in window){const det=new BarcodeDetector();camStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});v.srcObject=camStream;await v.play();
   camTimer=setInterval(async()=>{try{const r=await det.detect(v);if(r.length)camHit(r[0].rawValue)}catch(e){}},250)}
  else{await loadZX();zx=new ZXing.BrowserMultiFormatReader();await zx.decodeFromConstraints({video:{facingMode:'environment'}},v,r=>{if(r)camHit(r.getText())})}}
 catch(e){stopCam();toast('Camera not available here — use a USB / Bluetooth scanner')}}
function stopCam(){clearInterval(camTimer);if(zx){try{zx.reset()}catch(e){}zx=null}if(camStream){camStream.getTracks().forEach(x=>x.stop());camStream=null}const o=$('camov');if(o&&o.classList.contains('on')){o.classList.remove('on');o.innerHTML=''}}

 <div class="g2"><div><label>${t('idType')} *</label><select id="bidt">${IDS.map(i=>`<option>${i}</option>`).join('')}</select></div><div><label>${t('idNo')} *</label><input id="bidn"></div></div>

 <label>${t('notes')}</label><input id="bnote">
 ${trade?'':`<label>${t('methodQ')}</label><div class="chips" id="bm">${['cash','etransfer'].map((m,i)=>`<button class="chip ${i===0?'on':''}" data-m="${m}" onclick="[...this.parentNode.children].forEach(x=>x.classList.remove('on'));this.classList.add('on')">${t(m)}</button>`).join('')}</div>`}

function dupNote(im){if(!im)return'';const u=D.units.find(u=>u.imei===im);return u?`<div class="badc small">⚠ This IMEI is already in your records (${u.status})</div>`:''}
function checkBL(im){im=String(im||'').trim();if(!im)return toast('Enter the IMEI first');try{navigator.clipboard.writeText(im)}catch(e){}window.open('https://www.imei.info/?imei='+encodeURIComponent(im),'_blank');toast('IMEI copied — paste it if needed')}
function saveBuy(){const g=id=>$(id).value.trim();const b={device:g('bdev'),imei:g('bim'),cond:g('bcond'),storage:g('bsto'),battery:g('bbat'),colour:g('bcol'),price:r2(num(g('bpr'))),resale:r2(num(g('brs'))),
 seller:{name:g('bsn'),phone:g('bsp'),idType:g('bidt'),idNo:g('bidn')},note:g('bnote')};
 if(!b.device)return toast(t('device')+'?');if(!b.imei)return toast(t('imei')+'?');if(!b.seller.name||!b.seller.idNo)return toast('Seller name and ID are required');
 if(!['bc1','bc2','bc3'].every(id=>$(id).checked))return toast('Complete the checks first');
 if(D.units.some(u=>u.imei===b.imei&&u.status==='in'))return toast('This IMEI is already in stock');

function commitBuy(b,method){let p=D.products.find(p=>p.cat==='phone'&&p.name.toLowerCase()===b.device.toLowerCase());
 if(!p){p={id:uid(),name:b.device,cat:'phone',price:b.resale||r2(b.price*1.5),cost:b.price,qty:0,min:0,serial:true,sku:'',barcode:''};D.products.push(p)}

let RF='active',RQ='';
const ISSUES=['Screen','Battery','Charging port','Back glass','Camera','Speaker / mic','Water damage','Software','Button','No power'];
const CHECKS=['Powers on','Screen / touch','Face ID / Touch ID','Cameras','Speaker / mic','Charging','Wi-Fi / signal','Buttons'];
const NEXT={received:'repairing',repairing:'ready'};
function vRepairs(){return `<div class="row"><input class="grow" style="flex:1" placeholder="${t('search2')}" value="${esc(RQ)}" oninput="RQ=this.value;drawRepairs()"><button class="btn" onclick="ticketForm()">${t('newTicket')}</button></div>
 <div class="chips">${['active','received','repairing','ready','picked','all'].map(f=>`<button class="chip ${RF===f?'on':''}" onclick="RF='${f}';render()">${t(f)} ${f==='all'?'':'('+D.repairs.filter(r=>f==='active'?r.status!=='picked':r.status===f).length+')'}</button>`).join('')}</div><div class="list" id="rlist"></div>`}
function isOverdue(r){return r.status!=='picked'&&r.status!=='ready'&&r.due&&new Date(r.due+'T23:59').getTime()<Date.now()}
function repTotal(r){return ADD()?r2(r.quote*(1+D.settings.gst/100)):r.quote}
function repBal(r){return r2(repTotal(r)-(r.deposit||0))}
function drawRepairs(){const q=RQ.toLowerCase();
 const rs=D.repairs.filter(r=>(RF==='all'||(RF==='active'?r.status!=='picked':r.status===RF))&&(!q||(()=>{const h=(r.no+' '+custName(r.cust)+' '+((C(r.cust)||{}).phone||'')+' '+r.device+' '+r.imei+' '+r.issue).toLowerCase();const d=q.replace(/\D/g,'');return h.includes(q)||(d.length>=4&&h.replace(/\D/g,'').includes(d))})())).sort((a,b)=>b.ts-a.ts);
 $('rlist').innerHTML=rs.length?rs.map(r=>{const c=C(r.cust)||{};const od=isOverdue(r);return `<div class="tcard ${od?'overdue':''}">
  <div class="row" style="justify-content:space-between"><div><b>#${r.no}</b> · <b>${esc(c.name||'')}</b> <span class="muted">${esc(c.phone||'')}</span></div><div><span class="badge ${r.status}">${t(r.status)}</span> ${od?`<span class="badge" style="background:var(--bad)">${t('overdue')}</span>`:''}</div></div>

  <div class="row small muted"><span>${t('quote')}: <b style="color:var(--ink)">${money(r.quote)}</b>${ADD()?' +GST':''}</span>${r.deposit?`<span>${t('deposit')}: ${money(r.deposit)}</span>`:''}${r.status!=='picked'?`<span>${t('balance')}: <b style="color:var(--mango)">${money(repBal(r))}</b></span>`:''}<span>${t('due')}: ${r.due||'—'}</span></div>
  <div class="row" style="margin-top:10px">${NEXT[r.status]?`<button class="btn sm ${r.status==='repairing'?'':'blue'}" onclick="advance('${r.id}')">${r.status==='received'?t('start'):t('markReady')}</button>`:''}

  ${c.phone&&r.status!=='picked'?`<a class="btn ghost sm" style="text-decoration:none;display:inline-flex;align-items:center" href="${smsLink(r)}">${t('text')}</a>`:''}

function custIndex(){const m={};const g=id=>m[id]||(m[id]={last:0,days:new Set(),spent:0,imeis:new Set(),nos:new Set(),reps:0});const day=ts=>new Date(ts).toDateString();
 for(const s of D.sales)if(s.cust){const x=g(s.cust);x.spent+=s.total;x.last=Math.max(x.last,s.ts);x.days.add(day(s.ts));x.nos.add(String(s.no));x.nos.add('S'+s.no);s.lines.forEach(l=>l.imei&&x.imeis.add(l.imei))}
 for(const r of D.repairs)if(r.cust){const x=g(r.cust);x.reps++;x.last=Math.max(x.last,r.ts);x.days.add(day(r.ts));x.nos.add('R'+r.no);if(r.imei)x.imeis.add(r.imei)}
 for(const b of D.buys){const id=b.seller&&b.seller.cust;if(!id)continue;const x=g(id);x.last=Math.max(x.last,b.ts);x.days.add(day(b.ts));if(b.imei)x.imeis.add(b.imei)}
 for(const x of Object.values(m))x.spent=r2(x.spent);return m}
const lastOf=(ix,c)=>Math.max((ix[c.id]||{}).last||0,c.since||0);
function custSearch(q,ix){ix=ix||custIndex();const toks=String(q||'').toLowerCase().split(/\s+/).filter(Boolean);if(!toks.length)return [];const out=[];
 for(const c of D.customers){const x=ix[c.id]||{};const nm=(c.name||'').toLowerCase(),words=nm.split(/[\s\-'.]+/),pd=ph10(c.phone),em=(c.email||'').toLowerCase(),ex=((c.notes||'')+' '+(c.addr||'')).toLowerCase();let sc=0,all=true;
  for(const tk of toks){const d=digits(tk),tn=tk.replace(/^#/,'').toUpperCase();let v=0;
   if(d.length>=3&&pd&&!/^[a-z#]/i.test(tk)){if(pd===ph10(d))v=50;else if(pd.includes(d))v=30}
   if(words.some(w=>w.startsWith(tk)))v=Math.max(v,30);else if(tk.length>=2&&nm.includes(tk))v=Math.max(v,15);
   if(tk.length>=2&&em.includes(tk))v=Math.max(v,20);
   if(d.length>=6&&x.imeis&&[...x.imeis].some(i=>i.includes(d)))v=Math.max(v,40);
   if(x.nos&&x.nos.has(tn))v=Math.max(v,45);
   if(!v&&tk.length>=3&&ex.includes(tk))v=5;
   if(!v){all=false;break}sc+=v}
  if(all)out.push({c,sc,last:lastOf(ix,c)})}
 return out.sort((a,b)=>b.sc-a.sc||b.last-a.last).map(o=>o.c)}

function parseCSV(txt,dl){const rows=[];let row=[],f='',q=false;for(let i=0;i<txt.length;i++){const ch=txt[i];
 if(q){if(ch==='"'){if(txt[i+1]==='"'){f+='"';i++}else q=false}else f+=ch}
 else if(ch==='"'&&f==='')q=true;else if(ch===dl){row.push(f);f=''}else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&txt[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f=''}else f+=ch}
 if(f!==''||row.length){row.push(f);rows.push(row)}return rows}
function parseVCF(txt){const rows=[['Name','Phone','Email','Notes']];for(const card of txt.split(/BEGIN:VCARD/i).slice(1)){const un=card.replace(/\r?\n[ \t]/g,'');const get=re=>{const m=un.match(re);return m?m[1].trim():''};
 const fn=get(/^FN[^:]*:(.*)$/im)||get(/^N[^:]*:(.*)$/im).split(';').filter(Boolean).reverse().join(' ');const tel=get(/^TEL[^:]*:(.*)$/im),em=get(/^EMAIL[^:]*:(.*)$/im),org=get(/^ORG[^:]*:(.*)$/im);rows.push([fn,tel,em,org.replace(/;/g,' ')])}return rows}
function impText(txt){txt=String(txt||'');if(!txt.trim())return toast('Nothing to import');const first=txt.split(/\r?\n/)[0];
 const dl=first.includes('\t')?'\t':(first.split(';').length>first.split(',').length?';':',');impRows(parseCSV(txt,dl))}
function loadXLSX(){return new Promise((res,rej)=>{if(window.XLSX)return res();const sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';sc.onload=res;sc.onerror=()=>rej(new Error('x'));document.head.appendChild(sc)})}
async function impFile(file){if(!file)return;const ext=(file.name.split('.').pop()||'').toLowerCase();
 try{if(ext==='xlsx'||ext==='xls'){toast('Reading Excel file…');await loadXLSX();const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});const ws=wb.Sheets[wb.SheetNames[0]];impRows(XLSX.utils.sheet_to_json(ws,{header:1,raw:false,defval:''}))}
  else{const txt=await file.text();ext==='vcf'||/BEGIN:VCARD/i.test(txt)?impRows(parseVCF(txt)):impText(txt)}}
 catch(e){toast(ext.startsWith('xls')?'Could not read the Excel file here. In Excel use File → Save As → CSV, then import that.':'Could not read this file')}}
const IMPF=[['','— skip —'],['name','Name'],['first','First name'],['last','Last name'],['phone','Phone'],['email','Email'],['addr','Address'],['notes','Notes'],['since','Customer since']];
function guessField(h){h=String(h||'').toLowerCase().trim();if(!h)return'';if(/first|given/.test(h))return'first';if(/last|surname|family/.test(h))return'last';if(/e-?mail/.test(h))return'email';
 if(/phone|mobile|cell|tel|contact|number|#/.test(h))return'phone';if(/address|street|city|postal|addr/.test(h))return'addr';if(/since|created|date|joined|first visit|added/.test(h))return'since';
 if(/note|comment|memo|device|model|remark/.test(h))return'notes';if(/name|customer|client|full/.test(h))return'name';return''}
function impRows(rows){rows=(rows||[]).map(r=>r.map(v=>String(v??'').trim())).filter(r=>r.some(v=>v));if(!rows.length)return toast('No rows found');
 const n=Math.max(...rows.map(r=>r.length));rows=rows.map(r=>{while(r.length<n)r.push('');return r});
 const isHead=rows[0].some(v=>guessField(v))&&!rows[0].some(v=>digits(v).length>=7||v.includes('@'));let map;
 if(isHead)map=rows[0].map(guessField);else{map=Array(n).fill('');const sample=rows.slice(0,30);
  for(let j=0;j<n;j++){const col=sample.map(r=>r[j]).filter(Boolean);if(!col.length)continue;if(!map.includes('email')&&col.filter(v=>v.includes('@')).length>col.length/2)map[j]='email';
   else if(!map.includes('phone')&&col.filter(v=>digits(v).length>=7&&digits(v).length<=12).length>col.length/2)map[j]='phone';else if(!map.includes('name')&&col.filter(v=>/[a-z]/i.test(v)).length>col.length/2)map[j]='name'}}
 // a second phone column becomes notes
 let seenP=false;map=map.map(m=>{if(m==='phone'){if(seenP)return'notes';seenP=true}return m});
 IMP={rows,head:isHead,map,dup:'skip'};drawImp()}
function drawImp(){const I=IMP,body=I.head?I.rows.slice(1):I.rows,n=I.rows[0].length;
 $('impPrev').innerHTML=`<h3>Check the columns</h3><p class="small muted">${body.length} rows found. Pick what each column is — anything set to “skip” is ignored.</p>

 <button class="btn" style="width:100%;margin-top:8px" onclick="doImport()">Import ${body.length} customers</button>`}
function parseSince(v){if(!v)return null;const n=Number(v);if(n>20000&&n<80000)return Math.round((n-25569)*864e5);const t2=Date.parse(/^\d{4}-\d{2}-\d{2}$/.test(v)?v+'T12:00':v);return isNaN(t2)?null:t2}
async function doImport(){const I=IMP;if(!I.map.some(m=>['name','first','last','phone','email'].includes(m)))return toast('Pick at least a Name or Phone column');
 if(!(await needOwner('Import customers')))return;const body=I.head?I.rows.slice(1):I.rows;
 const byP={},byE={};D.customers.forEach(c=>{const p=ph10(c.phone);if(p.length>=7)byP[p]=c;if(c.email)byE[c.email.toLowerCase()]=c});let add=0,upd=0,skip=0,bad=0;
 for(const r of body){const o={name:'',first:'',last:'',phone:'',email:'',addr:'',notes:'',since:''};I.map.forEach((m,j)=>{if(!m||!r[j])return;o[m]=o[m]?o[m]+(m==='notes'||m==='addr'?', ':' ')+r[j]:r[j]});
  const name=(o.name||[o.first,o.last].filter(Boolean).join(' ')).trim()||o.phone||o.email;if(!name){bad++;continue}
  const p=ph10(o.phone),e=o.email.toLowerCase();const ex=(p.length>=7&&byP[p])||(e&&byE[e]);const since=parseSince(o.since);
  if(ex){if(I.dup==='update'){if(!ex.phone&&o.phone)ex.phone=o.phone;if(!ex.email&&o.email)ex.email=o.email;if(!ex.addr&&o.addr)ex.addr=o.addr;if(o.notes&&!(ex.notes||'').includes(o.notes))ex.notes=[ex.notes,o.notes].filter(Boolean).join(' · ');if(since&&(!ex.since||since<ex.since))ex.since=since;upd++}else skip++;continue}
  const c={id:uid(),name,phone:o.phone,email:o.email,addr:o.addr,notes:o.notes,created:Date.now(),imported:true};if(since)c.since=since;D.customers.push(c);add++;if(p.length>=7)byP[p]=c;if(e)byE[e]=c}
 logEv('settings','Imported customers: '+add+' added'+(upd?', '+upd+' updated':'')+(skip?', '+skip+' already existed':''));closeM();CQ='';CSORT='az';render();
 ask({title:'✓ Import finished',msg:add+' new customers added'+(upd?'\n'+upd+' existing customers updated':'')+(skip?'\n'+skip+' were already in the system':'')+(bad?'\n'+bad+' empty rows skipped':''),ok:'OK',cancel:false})}

function dupGroups(){const by={};const add=(k,c)=>{(by[k]=by[k]||[]).push(c)};for(const c of D.customers){const p=ph10(c.phone);if(p.length>=7)add('p'+p,c);else if(c.email)add('e'+c.email.toLowerCase().trim(),c)}
 return Object.values(by).filter(g=>g.length>1)}
function dupCust(){const gs=dupGroups();const ix=custIndex();window._dg=gs;
 openM(`<h2>🔀 Duplicate customers</h2>${gs.length?`<p class="muted small">These share the same phone number (or email). Merging keeps all their sales, repairs and phones under one customer.</p>
 ${gs.map((g,i)=>`<div class="tcard" style="margin-bottom:8px">${g.map(c=>`<div class="small"><b>${esc(c.name)}</b> · ${esc(fmtPhone(c.phone))}${c.email?' · '+esc(c.email):''} · ${money((ix[c.id]||{}).spent||0)}</div>`).join('')}<button class="btn sm" style="margin-top:6px" onclick="mergeGroup(${i})">Merge these ${g.length}</button></div>`).join('')}
 <button class="btn" onclick="mergeAll()">Merge all ${gs.length} groups</button>`:'<p class="ok">✓ No duplicate customers found.</p>'}`)}
function doMerge(g){const ix=custIndex();const keep=[...g].sort((a,b)=>((ix[b.id]||{}).spent||0)-((ix[a.id]||{}).spent||0)||(a.created||0)-(b.created||0))[0];const ids=g.filter(c=>c!==keep).map(c=>c.id);
 for(const c of g){if(c===keep)continue;['phone','email','addr'].forEach(k=>{if(!keep[k]&&c[k])keep[k]=c[k]});if(c.notes&&!(keep.notes||'').includes(c.notes))keep.notes=[keep.notes,c.notes].filter(Boolean).join(' · ');
  const s1=c.since||c.created;if(s1&&(!keep.since||s1<keep.since))keep.since=c.since||keep.since}
 D.sales.forEach(s=>{if(ids.includes(s.cust))s.cust=keep.id});D.repairs.forEach(r=>{if(ids.includes(r.cust))r.cust=keep.id});D.units.forEach(u=>{if(ids.includes(u.cust))u.cust=keep.id});D.buys.forEach(b=>{if(b.seller&&ids.includes(b.seller.cust))b.seller.cust=keep.id});if(ids.includes(cartCust))cartCust=keep.id;
 D.customers=D.customers.filter(c=>!ids.includes(c.id));logEv('settings','Merged '+g.length+' customers into '+keep.name)}
async function mergeGroup(i){const g=window._dg[i];if(!g||!(await needOwner('Merge customers')))return;doMerge(g);save();toast('Merged ✓');dupCust()}

function vBackup(){return `<h2>${t('backup')}</h2><div class="card"><p>${t('lastBk')}: <b>${D.lastBackup?fmtDT(D.lastBackup):t('never')}</b></p>

async function doBackup(){const ok=await download('ns-store-backup-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(D));if(ok){D.lastBackup=Date.now();logEv('settings','Backup downloaded');render()}}
function restore(file){if(!file)return;const rd=new FileReader();rd.onload=async()=>{try{const o=JSON.parse(rd.result);
 if(o.units&&o.seq&&o.settings){if(!(await yes(t('import'),'Replace ALL current data with this backup?','Replace',true)))return;D=Object.assign(blank(),o);D.settings=Object.assign(blank().settings,o.settings)}
 else{if(!(await yes(t('import'),'This looks like a backup from an older version. Import its products, customers and repairs?','Import')))return;importOld(o)}
 logEv('settings','Data restored from backup file');toast('Restored ✓');go('sell')}catch(e){ask({title:'Could not read this file',msg:e.message,ok:'OK',cancel:false})}};rd.readAsText(file)}
function importOld(o){const src=o.data||o;const arr=k=>Array.isArray(src[k])?src[k]:[];const idmap={};
 (arr('customers')).forEach(c=>{const id=uid();idmap[c.id]=id;D.customers.push({id,name:c.name||'',phone:c.phone||'',email:c.email||'',notes:c.notes||'',created:c.created||Date.now()})});
 (arr('products').concat(arr('inventory'))).forEach(p=>{const cat=(p.cat||p.category||'accessory').toLowerCase();const c=['phone','accessory','part','service'].find(x=>cat.startsWith(x))||'accessory';
  const np={id:uid(),name:p.name||'Item',cat:c,sku:p.sku||'',barcode:p.barcode||'',price:num(p.price),cost:num(p.cost),qty:parseInt(p.qty??p.stock??0)||0,min:parseInt(p.min??p.low??2)||0,serial:false};
  const ims=Array.isArray(p.imeis)?p.imeis:(p.units||[]);if(c==='phone'&&ims.length){np.serial=true;ims.forEach(u=>{const im=typeof u==='string'?u:u.imei;if(im)D.units.push({id:uid(),pid:np.id,imei:im,cost:num(u.cost||np.cost),cond:u.cond||'New',status:'in',source:'import',added:Date.now()})})}
  D.products.push(np)});
 (arr('repairs').concat(arr('tickets'))).forEach(r=>{const st=String(r.status||'received').toLowerCase();const status=st.includes('pick')?'picked':st.includes('ready')?'ready':st.includes('prog')||st.includes('repair')?'repairing':'received';
  const cid=idmap[r.cust||r.customerId]||findOrMakeCustomer(r.name||r.customer||'',r.phone||'');
  D.repairs.push({id:uid(),no:D.seq.repair++,ts:r.ts||r.created||Date.now(),status,cust:cid,device:r.device||'',imei:r.imei||'',issue:r.issue||r.problem||'',pass:r.pass||r.passcode||'',due:r.due||'',checks:[],quote:num(r.quote||r.price),deposit:num(r.deposit),parts:[],notes:r.notes||'',log:[{ts:Date.now(),s:status}]})})}

/* ================= BIIXIPAY CLOUD SYNC (Supabase) ================= */
const CKEY='ns_cloud_v1',HKEY='ns_cloud_hash_v1';
const SB_CDN='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js';
const COLS=['products','units','customers','sales','repairs','buys','pos','closes','counts','log'];
let CL={cfg:{},sb:null,user:null,status:'off',msg:'',hash:{},since:null,timer:null,busy:false,again:false,stores:null};
try{CL.cfg=JSON.parse(localStorage.getItem(CKEY)||'{}')}catch(e){}
try{const h=JSON.parse(localStorage.getItem(HKEY)||'{}');CL.hash=h.hash||{};CL.since=h.since||null}catch(e){}
function cSave(){try{localStorage.setItem(CKEY,JSON.stringify(CL.cfg));localStorage.setItem(HKEY,JSON.stringify({hash:CL.hash,since:CL.since}))}catch(e){}}
function hsh(str){let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0;i<str.length;i++){const c=str.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}
 h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return(h2>>>0).toString(36)+(h1>>>0).toString(36)}
const CST={off:'Not set up',sync:'Syncing…',ok:'✓ Synced',offline:'✗ Offline — will sync when back online',error:'⚠ Sync problem',login:'Sign in needed'};
function cloudInfoHTML(){return `<div class="card"><b>Status:</b> <span class="${CL.status==='ok'?'ok':CL.status==='sync'||CL.status==='off'?'muted':'warnc'}">${CST[CL.status]||CL.status}</span> <span class="muted small">${esc(CL.msg)}</span></div>`}
function setCloud(st,msg=''){CL.status=st;CL.msg=msg;const e=$('cloudSt');
 if(e){e.textContent={sync:'☁ …',ok:'☁ ✓',offline:'☁ ✗',error:'☁ !',login:'☁ ?'}[st]||'';e.title=(CST[st]||'')+' '+msg;e.style.display=st==='off'?'none':'';e.style.color=st==='ok'?'#4ade80':st==='sync'?'#9fb0d6':'#f59e0b'}
 const ci=$('cloudInfo');if(ci)ci.innerHTML=cloudInfoHTML()}
function loadSB(){return new Promise((res,rej)=>{if(window.supabase&&window.supabase.createClient)return res();const sc=document.createElement('script');sc.src=SB_CDN;sc.onload=res;sc.onerror=()=>rej(new Error('Could not load Supabase (no internet?)'));document.head.appendChild(sc)})}
async function cEnsure(){if(CL.sb)return;if(!CL.cfg.url||!CL.cfg.key)throw new Error('Save the Supabase URL and key first');await loadSB();
 CL.sb=window.supabase.createClient(CL.cfg.url,CL.cfg.key,{auth:{persistSession:true,storageKey:'ns_sb_auth'}});
 CL.sb.auth.onAuthStateChange((ev,ses)=>{CL.user=ses?ses.user:null})}
async function cInit(){if(!CL.cfg.url||!CL.cfg.key){setCloud('off');return}
 try{await cEnsure();const {data}=await CL.sb.auth.getSession();CL.user=data&&data.session?data.session.user:null;
  if(!CL.user)return setCloud('login','Sign in to BiixiPay Cloud');if(CL.cfg.storeId)cStart();else setCloud('login','Choose a store')}
 catch(e){setCloud('offline',e.message||String(e))}}
function cloudOn(){return !!(CL.sb&&CL.user&&CL.cfg.storeId)}
function cStart(){clearInterval(CL.timer);CL.timer=setInterval(()=>{if(!document.hidden)cSync()},20000);cSync()}
let cDeb=null;function cDirty(){if(!cloudOn())return;clearTimeout(cDeb);cDeb=setTimeout(cSync,1500)}
function metaRec(){const{lang,...st}=D.settings;return{settings:st,seq:D.seq,sample:!!D.sample}}
function localRecs(){const out={};let fixed=false;
 for(const k of COLS){(D[k]=D[k]||[]).forEach(r=>{if(!r.id){r.id=uid();fixed=true}out[k+':'+r.id]={kind:k,id:r.id,data:r}})}
 out['meta:main']={kind:'meta',id:'main',data:metaRec()};if(fixed)saveLocal();return out}
async function cPush(){const sid=CL.cfg.storeId;const cur=localRecs();const rows=[],newH={};
 for(const[key,r]of Object.entries(cur)){const h=hsh(JSON.stringify(r.data));if(CL.hash[key]!==h){rows.push({store_id:sid,kind:r.kind,id:r.id,data:r.data,deleted:false});newH[key]=h}}
 for(const key of Object.keys(CL.hash))if(!cur[key]){const i=key.indexOf(':');rows.push({store_id:sid,kind:key.slice(0,i),id:key.slice(i+1),data:{},deleted:true});newH[key]=null}
 for(let i=0;i<rows.length;i+=400){const part=rows.slice(i,i+400);const {error}=await CL.sb.from('pos_records').upsert(part,{onConflict:'store_id,kind,id'});if(error)throw error;
  part.forEach(r=>{const key=r.kind+':'+r.id;if(newH[key]===null)delete CL.hash[key];else CL.hash[key]=newH[key]})}
 cSave();return rows.length}
function applyRow(row){const key=row.kind+':'+row.id;
 if(row.kind==='meta'){const m=row.data||{};const dirty=CL.hash[key]&&CL.hash[key]!==hsh(JSON.stringify(metaRec()));
  if(!dirty&&m.settings)D.settings=Object.assign(blank().settings,m.settings,{lang:D.settings.lang});
  const seq=Object.assign({},D.seq);for(const k in(m.seq||{}))seq[k]=Math.max(seq[k]||0,m.seq[k]);D.seq=seq;if(!m.sample)delete D.sample;
  CL.hash[key]=hsh(JSON.stringify(m));return true}
 const arr=D[row.kind];if(!Array.isArray(arr))return false;const i=arr.findIndex(x=>x.id===row.id);
 if(i>=0&&CL.hash[key]&&hsh(JSON.stringify(arr[i]))!==CL.hash[key])return false; // local edit not uploaded yet — keep it
 if(row.deleted){delete CL.hash[key];if(i>=0){arr.splice(i,1);return true}return false}
 const h=hsh(JSON.stringify(row.data));CL.hash[key]=h;if(i>=0&&hsh(JSON.stringify(arr[i]))===h)return false;
 if(i>=0)arr[i]=row.data;else arr.push(row.data);return true}
async function cPull(){const sid=CL.cfg.storeId;const since=CL.since?new Date(new Date(CL.since).getTime()-15000).toISOString():'1970-01-01T00:00:00.000Z';
 let off=0,maxTs=CL.since,changed=0;
 while(true){const {data,error}=await CL.sb.from('pos_records').select('kind,id,data,deleted,updated_at').eq('store_id',sid).gt('updated_at',since).order('updated_at',{ascending:true}).range(off,off+999);
  if(error)throw error;for(const row of data){if(!maxTs||new Date(row.updated_at)>new Date(maxTs))maxTs=row.updated_at;if(applyRow(row))changed++}
  if(data.length<1000)break;off+=1000}
 CL.since=maxTs;cSave();if(changed){saveLocal();if(!$('ov').classList.contains('on')&&!(V==='menu'&&SUB==='cloud'))render()}return changed}
async function cSync(){if(!cloudOn())return;if(CL.busy){CL.again=true;return}CL.busy=true;setCloud('sync');
 try{if(!navigator.onLine)throw new Error('offline');if(CL.cfg.pullFirst){await cPull();CL.cfg.pullFirst=false;cSave()}await cPush();await cPull();setCloud('ok','Last sync '+new Date().toLocaleTimeString())}
 catch(e){const m=(e&&e.message)||String(e);if(/jwt|auth|not signed/i.test(m))setCloud('login','Sign in again');else{const off=!navigator.onLine||/fetch|network|offline|load/i.test(m);setCloud(off?'offline':'error',off?'':m)}}
 CL.busy=false;if(CL.again){CL.again=false;setTimeout(cSync,300)}}
window.addEventListener('online',()=>cSync());window.addEventListener('focus',()=>cSync());
async function cSaveConn(){const u=$('curl').value.trim().replace(/\/+$/,''),k=$('ckey').value.trim();if(!/^https:\/\//.test(u)||!k)return toast('Enter the project URL (https://…) and the anon key');
 CL.cfg={url:u,key:k};CL.sb=null;CL.user=null;CL.hash={};CL.since=null;CL.stores=null;cSave();toast(t('save')+' ✓');await cInit();render()}
async function cSignIn(up){const em=$('cem').value.trim(),pw=$('cpw').value;if(!em||!pw)return toast('Enter email and password');
 try{await cEnsure();const r=up?await CL.sb.auth.signUp({email:em,password:pw}):await CL.sb.auth.signInWithPassword({email:em,password:pw});if(r.error)throw r.error;
  CL.user=r.data&&r.data.session?r.data.user:null;if(!CL.user)return toast('Check your email to confirm the account, then sign in');
  toast('Signed in ✓');CL.stores=null;setCloud('login','Choose a store');render()}catch(e){toast(e.message||String(e))}}

async function cLoadStores(){try{const {data,error}=await CL.sb.from('pos_members').select('role,store_id,pos_stores(name)').eq('user_id',CL.user.id);if(error)throw error;CL.stores=data||[]}catch(e){CL.stores=[];toast(e.message||String(e))}render()}

function cUseIdx(i){const m=CL.stores[i];cUseStore(m.store_id,(m.pos_stores||{}).name||'Store',m.role,false)}
async function cUseStore(id,name,role,isNew){let count=0;
 if(!isNew){const {count:c,error}=await CL.sb.from('pos_records').select('id',{count:'exact',head:true}).eq('store_id',id);if(error)return toast(error.message);count=c||0}
 if(count>0){if(!(await yes('Load cloud data?','"'+name+'" already has data in the cloud. Load it onto this device?\n\nThis device\'s current data will be replaced. A backup file of it is downloaded first.','Load cloud data')))return;
  if(D.sales.length||D.repairs.length||D.customers.length)await download('ns-store-before-cloud-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(D));
  const lang=D.settings.lang;D=blank();D.settings.lang=lang;CL.cfg.pullFirst=true}
 CL.hash={};CL.since=null;Object.assign(CL.cfg,{storeId:id,storeName:name,role});cSave();saveLocal();toast('Connected to '+name+' ✓');cStart();render()}
async function cBackup(){if(!cloudOn())return toast('Connect to BiixiPay Cloud first');toast('Downloading from cloud…');
 try{if(CL.busy)await new Promise(r=>setTimeout(r,1500));await cPush();const out=blank();delete out.sample;const sid=CL.cfg.storeId;let off=0,n=0;
  while(true){const {data,error}=await CL.sb.from('pos_records').select('kind,id,data,deleted').eq('store_id',sid).order('kind').order('id').range(off,off+999);if(error)throw error;
   for(const r of data){if(r.deleted)continue;n++;if(r.kind==='meta'){Object.assign(out.settings,r.data.settings||{});Object.assign(out.seq,r.data.seq||{});if(r.data.sample)out.sample=true}else if(Array.isArray(out[r.kind]))out[r.kind].push(r.data)}
   if(data.length<1000)break;off+=1000}
  out.settings.lang=D.settings.lang;out.cloudBackup={store:CL.cfg.storeName,ts:Date.now(),records:n};
  const ok=await download('biixipay-cloud-backup-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(out));
  if(ok){D.lastBackup=Date.now();logEv('settings','Cloud backup downloaded');CL.cfg.lastCloudBackup=Date.now();cSave();toast('Cloud backup saved — '+n+' records ✓');render()}}
 catch(e){toast('Backup failed: '+(e.message||e))}}
async function cAddStaff(){const em=$('cst').value.trim();if(!em)return;try{const {error}=await CL.sb.rpc('pos_add_member',{p_store:CL.cfg.storeId,p_email:em});if(error)throw error;toast(em+' added ✓');$('cst').value=''}catch(e){toast(e.message||String(e))}}
async function cDisconnect(){if(!(await yes('Disconnect?','Disconnect this device from the cloud store? The data stays on this device.','Disconnect',true)))return;clearInterval(CL.timer);Object.assign(CL.cfg,{storeId:null,storeName:null,role:null});CL.hash={};CL.since=null;CL.stores=null;cSave();setCloud('login','Choose a store');render()}
function vCloud(){const c=CL.cfg;return `<h2>☁ BiixiPay Cloud</h2>
 <p class="muted small">Every sale, repair and stock change is saved online and all your devices stay in sync. The app still works without internet — changes upload when the connection is back.</p>
 <div id="cloudInfo">${cloudInfoHTML()}</div>
 <div class="card" style="margin-top:12px"><h3 style="margin-top:0">1. Connection</h3>
 <label>Supabase project URL</label><input id="curl" value="${esc(c.url||'')}" placeholder="https://xxxxxxxx.supabase.co" autocomplete="off">
 <label>Supabase anon (public) key</label><input id="ckey" value="${esc(c.key||'')}" placeholder="eyJhbGciOi…" autocomplete="off">
 <div class="row" style="margin-top:10px"><button class="btn" onclick="cSaveConn()">${t('save')}</button></div></div>
 ${c.url&&c.key?`<div class="card" style="margin-top:12px"><h3 style="margin-top:0">2. Account</h3>${CL.user?`<p>Signed in as <b>${esc(CL.user.email||'')}</b></p><button class="btn ghost" onclick="cSignOut()">Sign out</button>`
 :`<div class="g2"><div><label>Email</label><input id="cem" type="email" autocomplete="username"></div><div><label>Password</label><input id="cpw" type="password" autocomplete="current-password"></div></div>
 <div class="row" style="margin-top:10px"><button class="btn" onclick="cSignIn(false)">Sign in</button><button class="btn ghost" onclick="cSignIn(true)">Create account</button></div>`}</div>`:''}
 ${CL.user?`<div class="card" style="margin-top:12px"><h3 style="margin-top:0">3. Store</h3>${c.storeId?`<p>Connected to <b>${esc(c.storeName||'')}</b> <span class="badge">${esc(c.role||'')}</span></p>
 <div class="row"><button class="btn" onclick="cSync()">Sync now</button><button class="btn blue" onclick="cBackup()">💾 Download cloud backup</button><button class="btn ghost" onclick="cDisconnect()">Disconnect</button></div>
 <p class="small muted">Last cloud backup: ${c.lastCloudBackup?fmtDT(c.lastCloudBackup):t('never')}. Save the file to Google Drive or a USB stick each week. Restore it from Menu → Backup.</p>
 ${c.role==='owner'?`<label>Add staff by email (they create an account first)</label><div class="row"><input id="cst" type="email" style="flex:1" placeholder="staff@email.com"><button class="btn" onclick="cAddStaff()">${t('add')}</button></div>`:''}`
 :`${CL.stores===null?'<p class="muted">Loading stores…</p>':CL.stores.length?CL.stores.map((m,i)=>`<div class="line"><div class="nm"><b>${esc((m.pos_stores||{}).name||'Store')}</b> <span class="muted small">${esc(m.role)}</span></div><button class="btn sm" onclick="cUseIdx(${i})">Use this store</button></div>`).join(''):'<p class="muted">No stores yet — create one below.</p>'}
 <label>New store name</label><div class="row"><input id="csn" style="flex:1" value="${esc(D.settings.name)}"><button class="btn" onclick="cCreateStore()">Create & upload this device's data</button></div>`}</div>`:''}`}

/* ================= START ================= */
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(window._pp)return;if($('dlg').classList.contains('on'))return _dlgRes(null);stopCam();closeM()}});
setTimeout(cInit,0);
/* USB / Bluetooth scanners type fast and press Enter. Catch scans even when no box is selected. */
let WB='',WT=0;
document.addEventListener('keydown',e=>{const tg=e.target;if(tg&&tg.matches&&tg.matches('input,textarea,select'))return;if(e.ctrlKey||e.metaKey||e.altKey)return;
 const n=Date.now();if(n-WT>80)WB='';WT=n;
 if(e.key==='Enter'){if(WB.length>=4){e.preventDefault();routeScan(WB)}WB='';return}
 if(e.key.length===1)WB+=e.key});
function routeScan(v){if($('dlg').classList.contains('on')||$('lock').classList.contains('on'))return;const ov=$('ov').classList.contains('on');if(SCN&&ov&&$('scin'))return scanAdd(v);if(ov)return;
 if(V==='sell')return scanCode(v);if(V==='menu'&&SUB==='phones'){PHQ=v;return render()}
 if(V==='repairs'){RQ=v.replace(/^R/,'');return render()}
 if(!(V==='menu'&&SUB==='stock'))go('menu','stock');stockScan(v)}
render();
if((staffList().length&&(!who()||D.settings.lockOnOpen))||(!staffList().length&&adminOn()&&D.settings.lockOnOpen))lockNow();
</script>
